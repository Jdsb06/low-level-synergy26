<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">libmemctl: from memory requests to reusable Linux mappings</title>
  <desc id="desc">The four my_* APIs route to eight shards. Small allocations reuse size-class regions, larger allocations use dedicated mappings, and empty caches share a two mebibyte budget.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#0b111c"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#233147" stroke-width="0.5" opacity="0.45"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#58d9bb"/></marker>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#background)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="42" y="34" width="8" height="19" rx="3" fill="#58d9bb"/>
    <text x="64" y="49" fill="#a6bdd4" font-size="14" letter-spacing="3">SYNERGY '26 / SYSTEMS PROGRAMMING</text>
    <text x="42" y="110" fill="#f0f6fc" font-size="48" font-weight="700" letter-spacing="-2">From pages to pointers.</text>
    <text x="43" y="144" fill="#b3c5d8" font-size="19">A C11 allocator that reuses memory before asking Linux for more.</text>
    <g transform="translate(42 184)">
      <rect width="245" height="85" rx="12" fill="#162337" stroke="#364a64"/>
      <text x="20" y="29" fill="#dbe9f6" font-size="16" font-weight="700">4 allocation APIs</text>
      <text x="20" y="53" fill="#9cb5ce" font-family="DejaVu Sans Mono, monospace" font-size="13">my_malloc / my_calloc</text>
      <text x="20" y="73" fill="#58d9bb" font-family="DejaVu Sans Mono, monospace" font-size="13">my_realloc / my_free</text>
    </g>
    <path d="M 300 226 H 350" fill="none" stroke="#58d9bb" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(366 184)">
      <rect width="220" height="85" rx="12" fill="#162337" stroke="#364a64"/>
      <text x="20" y="29" fill="#dbe9f6" font-size="16" font-weight="700">8 shards</text>
      <text x="20" y="53" fill="#9cb5ce" font-size="13">Separate locks, stable owners</text>
      <g fill="#58d9bb"><rect x="20" y="64" width="17" height="7" rx="2"/><rect x="43" y="64" width="17" height="7" rx="2"/><rect x="66" y="64" width="17" height="7" rx="2"/><rect x="89" y="64" width="17" height="7" rx="2"/><rect x="112" y="64" width="17" height="7" rx="2"/><rect x="135" y="64" width="17" height="7" rx="2"/><rect x="158" y="64" width="17" height="7" rx="2"/><rect x="181" y="64" width="17" height="7" rx="2"/></g>
    </g>
    <path d="M 600 226 H 650" fill="none" stroke="#58d9bb" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(666 184)">
      <rect width="255" height="85" rx="12" fill="#15302f" stroke="#357b6d"/>
      <text x="20" y="29" fill="#d7fff3" font-size="16" font-weight="700">Reusable blocks</text>
      <text x="20" y="53" fill="#9dcdbd" font-size="13">Size classes + large-object reuse</text>
      <text x="20" y="73" fill="#58d9bb" font-size="11">private anonymous mappings underneath</text>
    </g>
    <g transform="translate(947 186)">
      <text x="0" y="24" fill="#f0f6fc" font-size="31" font-weight="700">2 MiB</text>
      <text x="0" y="45" fill="#9cb5ce" font-size="12">shared empty-cache cap</text>
      <text x="0" y="66" fill="#58d9bb" font-size="12">trim releases empty maps</text>
    </g>
    <path d="M 42 293 H 1158" stroke="#293a50"/>
    <text x="43" y="317" fill="#819bb6" font-size="12" letter-spacing="1">C11</text>
    <text x="111" y="317" fill="#819bb6" font-size="12" letter-spacing="1">LINUX</text>
    <text x="202" y="317" fill="#819bb6" font-size="12" letter-spacing="1">PTHREADS</text>
    <text x="333" y="317" fill="#819bb6" font-size="12" letter-spacing="1">NO SYSTEM-HEAP FORWARDING</text>
    <text x="1158" y="317" text-anchor="end" fill="#58d9bb" font-size="12" letter-spacing="1">LIBMEMCTL / SYSPROG10</text>
  </g>
</svg>
